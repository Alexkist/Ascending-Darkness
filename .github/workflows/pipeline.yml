name: Modpack Release | Pipeline

on:
  push:
    branches:
      - main

env:
  default-release-modrinth: 'true'
  default-release-curseforge: 'false'


jobs:

  # Opens/updates the release PR, and creates the GitHub release + tag
  # once that PR is merged. All settings live in release-please-config.json.
  release-please:
    name: Handle Releases

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      paths-released: ${{ steps.release-please.outputs.paths_released }}
      all: ${{ toJSON(steps.release-please.outputs) }}

    steps:
      - name: Perform Release with Release Please
        id: release-please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json


  # Runs once per modpack that was just released (e.g. ["main"]).
  publish:
    name: Build & Publish ${{ matrix.modpack }}

    needs:
      - release-please

    if: ${{ needs.release-please.outputs.paths-released != '' && needs.release-please.outputs.paths-released != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        modpack: ${{ fromJSON(needs.release-please.outputs.paths-released) }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      release-tag: ${{ fromJSON(needs.release-please.outputs.all)[format('{0}--tag_name', matrix.modpack)] }}

    steps:
      - name: Check Out Git Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse Pack File
        id: parse
        uses: ./.github/actions/parse
        with:
          modpack: ${{ matrix.modpack }}

      - name: Set Mod Vendors
        id: set-mod-vendors
        run: |
          [[ ! -z "${{ secrets.CURSEFORGE_TOKEN }}" && ! -z "${{ secrets.CURSEFORGE_ID }}" ]] && echo "curseforge=true" >> $GITHUB_OUTPUT || echo "curseforge=false" >> $GITHUB_OUTPUT
          [[ ! -z "${{ secrets.MODRINTH_TOKEN }}" && ! -z "${{ secrets.MODRINTH_ID }}" ]] && echo "modrinth=true" >> $GITHUB_OUTPUT || echo "modrinth=false" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build Modpack
        uses: ./.github/actions/build
        with:
          modpack: ${{ matrix.modpack }}
          release-tag: ${{ env.release-tag }}
          build-modrinth: ${{ env.default-release-modrinth }}
          build-curse: ${{ env.default-release-curseforge }}

      - name: Release Modpack to Vendors
        uses: ./.github/actions/release
        with:
          modpack: ${{ matrix.modpack }}
          release-tag: ${{ env.release-tag }}
          loader: ${{ env.loader }}
          game-version: ${{ env.game-version }}
          upload-modrinth: ${{ steps.set-mod-vendors.outputs.modrinth }}
          upload-curse: ${{ steps.set-mod-vendors.outputs.curseforge }}
          MODRINTH_ID: ${{ secrets.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_ID: ${{ secrets.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        if: steps.set-mod-vendors.outputs.modrinth == 'true' || steps.set-mod-vendors.outputs.curseforge == 'true'